[project]
name = "watchman-review"
version = "0.1.0"
description = "A tool-using, verifying AI reviewer for code written by AI coding agents."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.12"
authors = [{ name = "Andrew Krupp" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tomli-w>=1.0",
    # Bundled deterministic tools so Watchman works on repos that don't vendor them.
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.scripts]
watchman = "watchman_review.cli:app"
wm = "watchman_review.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchman_review"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]
extend-exclude = ["tests/fixtures", "evals/datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Embedded unified-diff fixtures contain meaningful trailing whitespace.
"tests/**" = ["W291", "W293"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "evals"]
exclude = ["tests/fixtures/", "evals/datasets/"]

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*", "ruff", "ruff.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test requires network access (deselect with -m 'not network')",
    "docker: test requires a working docker daemon",
]
